name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: model
        uses: actions/cache@v4
        with:
          path: _model
          key: tinyclip40-${{ hashFiles('tools/build_model.py') }}
      - name: Build photo model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          pip install numpy scipy ftfy regex
          pip install --no-deps open_clip_torch==3.3.0
          curl -sSL -o ck.pt https://github.com/wkcn/TinyCLIP-model-zoo/releases/download/checkpoints/TinyCLIP-ViT-40M-32-Text-19M-LAION400M.pt
          python tools/build_model.py ck.pt _model
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r "time-to-save-github 2"/. _site/
          mkdir -p _site/models _site/lib
          cp _model/* _site/models/
          npm pack @tensorflow/tfjs@4.22.0 --silent
          tar xzf tensorflow-tfjs-4.22.0.tgz package/dist/tf.min.js
          cp package/dist/tf.min.js _site/lib/
          npm pack tesseract.js@5.1.1 tesseract.js-core@5.1.1 @tesseract.js-data/rus@1.0.0 @tesseract.js-data/eng@1.0.0 pdfjs-dist@4.10.38 --silent > /dev/null
          mkdir -p _site/lib/tesseract _site/lib/tessdata _site/lib/pdfjs ocr
          tar xzf tesseract.js-5.1.1.tgz -C ocr && cp ocr/package/dist/tesseract.min.js ocr/package/dist/worker.min.js _site/lib/tesseract/ && rm -rf ocr/package
          tar xzf tesseract.js-core-5.1.1.tgz -C ocr && cp ocr/package/tesseract-core-simd-lstm.wasm.js ocr/package/tesseract-core-lstm.wasm.js _site/lib/tesseract/ && rm -rf ocr/package
          tar xzf tesseract.js-data-rus-1.0.0.tgz -C ocr && cp ocr/package/4.0.0_best_int/rus.traineddata.gz _site/lib/tessdata/ && rm -rf ocr/package
          tar xzf tesseract.js-data-eng-1.0.0.tgz -C ocr && cp ocr/package/4.0.0_best_int/eng.traineddata.gz _site/lib/tessdata/ && rm -rf ocr/package
          tar xzf pdfjs-dist-4.10.38.tgz -C ocr && cp ocr/package/build/pdf.min.mjs ocr/package/build/pdf.worker.min.mjs _site/lib/pdfjs/ && rm -rf ocr/package
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
